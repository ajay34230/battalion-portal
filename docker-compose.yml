version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: battalion_portal
      POSTGRES_USER: battalion_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_env_file}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battalion_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
      DB_NAME: battalion_portal
      DB_USER: battalion_admin
      DB_PASSWORD: ${DB_PASSWORD:-changeme_in_env_file}
      SECRET_KEY: ${SECRET_KEY:-changeme_in_env_file}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-battalion-portal.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://battalion-portal.local}
      SECURE_SSL_REDIRECT: "False"   # nginx handles the HTTP->HTTPS redirect; avoid a double redirect
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
      - nas_storage:/mnt/nas          # map to your Windows shared folder / Nextcloud data dir via WSL2
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media_data:
  static_data:
  nas_storage:
    driver_opts:
      type: none
      device: /mnt/nas_share        # bind-mount your actual NAS/shared path (or Nextcloud data dir) here
      o: bind
