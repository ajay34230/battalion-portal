# Battalion Portal — nginx reverse proxy
# Terminates TLS, restricts access to the unit LAN subnet, and routes
# /api and /admin to Django while serving the built frontend directly.

upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name battalion-portal.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name battalion-portal.local;

    # Self-signed / internal-CA cert for LAN use — replace with your unit's cert
    ssl_certificate     /etc/nginx/certs/battalion-portal.crt;
    ssl_certificate_key /etc/nginx/certs/battalion-portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- LAN restriction: adjust to your actual subnet(s) ---
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
