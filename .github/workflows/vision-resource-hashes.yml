name: VISION resolve resource hashes
on:
  workflow_dispatch:
  push:
    branches: ['vision/phase-0']
    paths: ['.github/workflows/vision-resource-hashes.yml']
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Hugging Face LFS hashes, sizes and gating check
        run: |
          python3 - <<'PY'
          import json, urllib.request, subprocess
          repos = ["litert-community/gemma-4-E4B-it-litert-lm","litert-community/gemma-4-E2B-it-litert-lm"]
          for repo in repos:
            try:
              tree = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true"))
            except Exception as e:
              print(f"::notice title=HASH::{repo} NOT FOUND/ERROR {e}"); continue
            for it in tree:
              fn = it.get("path","")
              if not (fn.endswith(".litertlm") or fn.endswith(".task")): continue
              lfs = it.get("lfs") or {}
              code = subprocess.run(["curl","-sIL","-o","/dev/null","-w","%{http_code}",f"https://huggingface.co/{repo}/resolve/main/{fn}"],capture_output=True,text=True).stdout
              print(f"::notice title=HASH::{repo} {fn} size={lfs.get('size')} sha256={lfs.get('oid')} anonymous_http={code}")
          PY
      - name: Maven versions
        run: |
          for u in https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/maven-metadata.xml https://repo1.maven.org/maven2/com/alphacephei/vosk-android/maven-metadata.xml https://repo1.maven.org/maven2/net/java/dev/jna/jna/maven-metadata.xml https://dl.google.com/android/maven2/com/google/mlkit/text-recognition/maven-metadata.xml https://dl.google.com/android/maven2/com/google/mlkit/text-recognition-devanagari/maven-metadata.xml https://dl.google.com/android/maven2/com/google/mlkit/image-labeling/maven-metadata.xml https://repo1.maven.org/maven2/org/apache/pdfbox/pdfbox/maven-metadata.xml https://dl.google.com/android/maven2/androidx/camera/camera-core/maven-metadata.xml; do
            v=$(curl -sSf "$u" | tr -d '\n ' | grep -o '<release>[^<]*\|<latest>[^<]*\|<version>[^<]*' | tail -6 | tr '\n' ' ')
            echo "::notice title=MAVEN::$u $v"
          done
      - name: Vosk model hashes (official host, downloaded over HTTPS)
        run: |
          for m in vosk-model-small-en-us-0.15 vosk-model-small-hi-0.22; do
            curl -sSfL -o "$m.zip" "https://alphacephei.com/vosk/models/$m.zip" || { echo "::notice title=VOSK::$m DOWNLOAD FAILED"; continue; }
            echo "::notice title=VOSK::$m size=$(wc -c < $m.zip) sha256=$(sha256sum $m.zip | cut -d' ' -f1)"
          done
      - name: Gradle plugin versions
        run: |
          for u in \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/maven-metadata.xml \
            https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml \
            https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            https://dl.google.com/android/maven2/androidx/room/room-runtime/maven-metadata.xml \
            https://dl.google.com/android/maven2/androidx/compose/compose-bom/maven-metadata.xml \
            https://dl.google.com/android/maven2/androidx/work/work-runtime-ktx/maven-metadata.xml ; do
            v=$(curl -sSf "$u" | tr -d '\n ' | grep -o '<version>[^<]*' | sed 's/<version>//' | grep -v -E 'alpha|beta|rc|RC|dev|-M' | tail -4 | tr '\n' ' ')
            echo "::notice title=PLUGINS::$(basename $(dirname $u)) $v"
          done
