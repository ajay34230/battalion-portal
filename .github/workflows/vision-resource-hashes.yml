name: VISION resolve resource hashes
on:
  workflow_dispatch:
  push:
    branches: ['vision/phase-0']
    paths: ['.github/workflows/vision-resource-hashes.yml']
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hugging Face LFS hashes, sizes and gating check
        run: |
          python3 - <<'PY'
          import json, urllib.request, subprocess
          repos = ["litert-community/Qwen3.5-9B","litert-community/Qwen3.5-4B"]
          for repo in repos:
            try:
              tree = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true"))
            except Exception as e:
              print(f"::notice title=HASH::{repo} NOT FOUND/ERROR {e}"); continue
            for it in tree:
              fn = it.get("path","")
              if not (fn.endswith(".litertlm") or fn.endswith(".task")): continue
              lfs = it.get("lfs") or {}
              code = subprocess.run(["curl","-sIL","-o","/dev/null","-w","%{http_code}",f"https://huggingface.co/{repo}/resolve/main/{fn}"],capture_output=True,text=True).stdout
              print(f"::notice title=HASH::{repo} {fn} size={lfs.get('size')} sha256={lfs.get('oid')} anonymous_http={code}")
          PY
      - name: Check every manifest model against Hugging Face
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, json, urllib.request, urllib.error
          print('::notice title=MODELCHECK::start')
          src = open("vision/app/src/main/java/com/vision/assistant/core/ResourceManifest.kt").read()
          found = 0
          for m in re.finditer(r'"\$HF/([^"]+)",\s*"([^"]+)",\s*"([0-9a-f]{64})",\s*([0-9_]+)', src):
            found += 1
            path, fn, sha, size = m.group(1), m.group(2), m.group(3), int(m.group(4).replace("_",""))
            repo, _, rest = ("litert-community/" + path).partition("/resolve/main/")
            url = "https://huggingface.co/" + repo + "/resolve/main/" + rest
            try:
              req = urllib.request.Request(url, method="HEAD")
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self, *a, **k): return None
              op = urllib.request.build_opener(NoRedirect)
              try: op.open(req)
              except urllib.error.HTTPError as e:
                h = e.headers; live = (h.get("X-Linked-ETag") or h.get("ETag") or "").strip('"'); lsize = h.get("X-Linked-Size") or h.get("Content-Length")
                print(f"::notice title=MODELCHECK::{fn} http={e.code} manifest_sha={sha[:12]} live_sha={live} match={live==sha} manifest_size={size} live_size={lsize} size_match={str(size)==str(lsize)}")
            except Exception as ex:
              print(f"::notice title=MODELCHECK::{fn} ERROR {ex}")
          print(f'::notice title=MODELCHECK::entries_found={found}')
          PY
      - name: Candidate models (files, hashes, licence, gating)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, subprocess
          repos = ["litert-community/Phi-4-mini-instruct","litert-community/gemma-4-12B-it-litert-lm","litert-community/Nanbeige4.2-3B","google/gemma-3n-E2B-it-litert-lm","google/gemma-3n-E4B-it-litert-lm","litert-community/granite-4.0-350m-litert-lm","litert-community/SmolLM2-360M-Instruct","litert-community/Qwen2.5-1.5B-Instruct","litert-community/Qwen3-14B"]
          for repo in repos:
            try:
              info = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}"))
              lic = (info.get("cardData") or {}).get("license"); gated = info.get("gated")
              tree = json.load(urllib.request.urlopen(f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true"))
            except Exception as e:
              print(f"::notice title=CAND::{repo} ERROR {e}"); continue
            parts = []
            for it in tree:
              fn = it.get("path","")
              if not fn.endswith(".litertlm"): continue
              lfs = it.get("lfs") or {}
              parts.append(f"{fn};{lfs.get('size')};{lfs.get('oid')}")
            code = subprocess.run(["curl","-sIL","-o","/dev/null","-w","%{http_code}",f"https://huggingface.co/{repo}/resolve/main/{(tree[0]['path'] if not parts else parts[0].split(';')[0])}"],capture_output=True,text=True).stdout
            print(f"::notice title=CAND::{repo} | licence={lic} | gated={gated} | anon_http={code} | files: " + " || ".join(parts[:3]) + f" (+{max(0,len(parts)-3)} more)")
          PY
      - name: Maven versions
        run: |
          for u in https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/maven-metadata.xml https://repo1.maven.org/maven2/com/alphacephei/vosk-android/maven-metadata.xml https://repo1.maven.org/maven2/net/java/dev/jna/jna/maven-metadata.xml https://dl.google.com/android/maven2/com/google/mlkit/text-recognition/maven-metadata.xml https://dl.google.com/android/maven2/com/google/mlkit/text-recognition-devanagari/maven-metadata.xml https://dl.google.com/android/maven2/com/google/mlkit/image-labeling/maven-metadata.xml https://repo1.maven.org/maven2/org/apache/pdfbox/pdfbox/maven-metadata.xml https://dl.google.com/android/maven2/androidx/camera/camera-core/maven-metadata.xml; do
            v=$(curl -sSf "$u" | tr -d '\n ' | grep -o '<release>[^<]*\|<latest>[^<]*\|<version>[^<]*' | tail -6 | tr '\n' ' ')
            echo "::notice title=MAVEN::$u $v"
          done
      - name: Vosk model hashes (official host, downloaded over HTTPS)
        run: |
          for m in vosk-model-small-en-us-0.15 vosk-model-small-hi-0.22 vosk-model-spk-0.4; do
            curl -sSfL -o "$m.zip" "https://alphacephei.com/vosk/models/$m.zip" || { echo "::notice title=VOSK::$m DOWNLOAD FAILED"; continue; }
            echo "::notice title=VOSK::$m size=$(wc -c < $m.zip) sha256=$(sha256sum $m.zip | cut -d' ' -f1)"
          done
      - name: Vosk Java API (speaker model)
        run: |
          curl -sSfL -o v.aar https://repo1.maven.org/maven2/com/alphacephei/vosk-android/0.3.47/vosk-android-0.3.47.aar && unzip -oq v.aar classes.jar
          for c in org.vosk.Recognizer org.vosk.SpeakerModel org.vosk.SpkModel; do
            javap -cp classes.jar $c 2>&1 | tr '\n' ' ' | sed 's/^/::notice title=VOSKAPI::/'; echo
          done
      - name: llama.cpp Android example (release tag and layout)
        run: |
          tag=$(curl -sSf https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "::notice title=LLAMA-TAG::$tag"
          curl -sSf "https://api.github.com/repos/ggml-org/llama.cpp/git/trees/$tag?recursive=1" | python3 -c "
          import sys,json
          t=json.load(sys.stdin)['tree']
          p=[x['path']+(' '+str(x.get('size','')) if x['type']=='blob' else '') for x in t if x['path'].startswith('examples/llama.android')]
          print('::notice title=LLAMA-ANDROID-TREE::'+' | '.join(p)[:3500])
          "
          echo "$tag" > tag.txt
      - name: llama.cpp Android JNI sources
        run: |
          tag=$(cat tag.txt)
          base=https://raw.githubusercontent.com/ggml-org/llama.cpp/$tag/examples/llama.android/lib
          for f in build.gradle.kts src/main/cpp/CMakeLists.txt; do
            echo "::notice title=LLAMA-FILE $f::$(curl -sSf $base/$f | head -c 6000 | python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.stdin.read()))')"
          done
      - name: Gradle plugin versions
        run: |
          for u in \
            https://plugins.gradle.org/m2/org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/maven-metadata.xml \
            https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml \
            https://dl.google.com/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            https://dl.google.com/android/maven2/androidx/room/room-runtime/maven-metadata.xml \
            https://dl.google.com/android/maven2/androidx/compose/compose-bom/maven-metadata.xml \
            https://dl.google.com/android/maven2/androidx/work/work-runtime-ktx/maven-metadata.xml ; do
            v=$(curl -sSf "$u" | tr -d '\n ' | grep -o '<version>[^<]*' | sed 's/<version>//' | grep -v -E 'alpha|beta|rc|RC|dev|-M' | tail -4 | tr '\n' ' ')
            echo "::notice title=PLUGINS::$(basename $(dirname $u)) $v"
          done
