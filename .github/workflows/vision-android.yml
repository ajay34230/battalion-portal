name: VISION Android build
on:
  push:
    paths: ['vision/**', '.github/workflows/vision-android.yml']
  workflow_dispatch:
concurrency:
  group: vision-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unit tests and debug APK
        run: |
          set +e
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$( (grep -E "Caused by|^e: |error:|Error:" build.log | awk "!s[\$0]++" | head -25; grep -E "^e: |What went wrong|Could not |Execution failed|FAILED|error:|bad class file|Caused by" -A4 build.log) | head -200 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GRADLE_ERRORS::$msg"
          else
            echo "::notice title=VISION::GRADLE_BUILD_AND_TESTS_OK"
          fi
          exit $code
      - name: Publish debug APK as a prerelease
        if: github.ref == 'refs/heads/vision/phase-0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vision-debug.apk
          gh release create "vision-dev-${{ github.run_number }}" vision-debug.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "VISION dev build ${{ github.run_number }}" --notes "Debug APK from ${{ github.sha }}. Unverified on real devices; see vision/docs/KNOWN_LIMITATIONS.md."
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vision-debug-apk
          path: vision/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: vision-build-reports
          path: vision/app/build/reports
