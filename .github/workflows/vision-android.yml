name: VISION Android build
on:
  push:
    paths: ['vision/**', '.github/workflows/vision-android.yml']
  workflow_dispatch:
concurrency:
  group: vision-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unit tests and debug APK
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/accept"
          export VISION_TEMPLATE_OUT="$RUNNER_TEMP/accept"
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            msg=$( (grep -E "Caused by|^e: |error:|Error:" build.log | awk "!s[\$0]++" | head -25; grep -E "^e: |What went wrong|Could not |Execution failed|FAILED|error:|bad class file|Caused by" -A4 build.log) | head -200 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GRADLE_ERRORS::$msg"
          else
            echo "::notice title=VISION::GRADLE_BUILD_AND_TESTS_OK"
          fi
          exit $code
      - name: Coding acceptance tests (really executed with Node and Python)
        run: |
          set -e
          A="$RUNNER_TEMP/accept"
          ls -R "$A" | head -40
          echo "== A. calculator logic (node) =="; (cd "$A/calculator" && node test.js)
          echo "== A. calculator keyboard/DOM smoke (node + jsdom-free stub) =="; (cd "$A/calculator" && node -e "global.document={getElementById:()=>({}),querySelectorAll:()=>[],addEventListener:()=>{}};const {createCalculator}=require('./calc.js');global.createCalculator=createCalculator;require('vm');new Function('createCalculator', require('fs').readFileSync('app.js','utf8'))(createCalculator);console.log('app.js loads')")
          echo "== B. python utility on sample file =="; (cd "$A/csv-report" && python3 report.py sample.csv && python3 test_report.py -v)
          echo "== C. website: all pages exist and every local link resolves =="; (cd "$A/website" && python3 - <<'PY'
import re, os, sys
pages=[f for f in os.listdir('.') if f.endswith('.html')]
assert len(pages)>=3, pages
bad=[]
for p in pages:
    t=open(p).read()
    assert 'name="viewport"' in t, p+' lacks viewport'
    for ref in re.findall(r'(?:href|src)="([^"#?]+)"', t):
        if ref.startswith(('http','mailto:')): continue
        if not os.path.exists(ref): bad.append((p,ref))
css=open('css/site.css').read(); assert '@media' in css
print('pages:',pages,'broken links:',bad); sys.exit(1 if bad else 0)
PY
)
        working-directory: .
      - name: Publish debug APK as a prerelease
        if: github.ref == 'refs/heads/vision/phase-0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vision-debug.apk
          cp app/build/outputs/apk/release/app-release.apk vision-release.apk
          gh release create "vision-dev-${{ github.run_number }}" vision-release.apk vision-debug.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "VISION dev build ${{ github.run_number }}" --notes "Release (faster, install this one) and debug APKs from ${{ github.sha }}. Unverified on real devices; see vision/docs/KNOWN_LIMITATIONS.md."
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vision-debug-apk
          path: vision/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: vision-build-reports
          path: vision/app/build/reports
